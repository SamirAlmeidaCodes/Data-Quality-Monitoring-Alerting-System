[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqmonitor"
version = "1.0.0"
description = "Scheduled data quality checks, stored results, and alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "apscheduler==3.11.3",
  "pandas==3.1.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
dqmonitor = "dqmonitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dqmonitor = ["api/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
