services:
  monitor:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DQ_CONFIG: /app/config/rules.yaml
      DQ_ENV: production
      LOG_LEVEL: INFO
      HOME: /tmp
    # Optional secrets. Copy .env.example to .env. Do not put secrets here.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    # Non-root. Export UID and GID if your account is not 1000:1000 so ./data stays writable.
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/quality/status')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
