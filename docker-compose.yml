services:
  monitor:
    build: .
    ports:
      - "8000:8000"
    environment:
      DQ_CONFIG: /app/config/rules.yaml
      LOG_LEVEL: INFO
      # DQ_SMTP_PASSWORD: ""
      # DQ_WEBHOOK_TOKEN: ""
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/quality/status')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
